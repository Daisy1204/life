name: Pull request preview

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: pr-preview-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  preview:
    name: Publish preview link
    runs-on: ubuntu-latest
    steps:
      - name: Check out the pull request revision
        uses: actions/checkout@v4

      - name: Validate required site files
        shell: bash
        run: |
          set -euo pipefail
          test -f index.html
          test -f styles.css
          test -f script.js

      - name: Upload a downloadable preview fallback
        uses: actions/upload-artifact@v4
        with:
          name: life-pr-${{ github.event.pull_request.number }}-preview
          path: |
            index.html
            styles.css
            script.js
          if-no-files-found: error
          retention-days: 14

      - name: Add preview link to the workflow summary
        env:
          PREVIEW_URL: https://raw.githack.com/${{ github.repository }}/${{ github.event.pull_request.head.sha }}/index.html
        run: |
          {
            echo '## Browser preview'
            echo
            echo "[Open this PR revision in a browser](${PREVIEW_URL})"
            echo
            echo 'This URL is pinned to the exact PR commit and does not deploy to GitHub Pages.'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Create or update the preview comment
        uses: actions/github-script@v7
        env:
          PREVIEW_URL: https://raw.githack.com/${{ github.repository }}/${{ github.event.pull_request.head.sha }}/index.html
        with:
          script: |
            const marker = '<!-- life-pr-preview -->';
            const body = `${marker}
            ## Browser preview

            [**Open the website preview for this revision ↗**](${process.env.PREVIEW_URL})

            This preview is pinned to commit \`${context.payload.pull_request.head.sha.slice(0, 7)}\`. It renders the PR's HTML, CSS, and JavaScript through RawGitHack and **does not deploy to or replace the production GitHub Pages site**.

            If the repository is private or the external preview service is unavailable, download the \`life-pr-${context.issue.number}-preview\` artifact from this workflow run and serve it locally.`;

            const comments = await github.paginate(github.rest.issues.listComments, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              per_page: 100,
            });
            const existing = comments.find((comment) =>
              comment.user.type === 'Bot' && comment.body.includes(marker)
            );

            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }
