<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="life by ON Original Nutrition — A Seed with Purpose." />
    <title>life — A Seed with Purpose</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500&amp;family=Noto+Sans+TC:wght@300;400&amp;family=Newsreader:opsz,wght@6..72,300;6..72,400&amp;display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main>
      <section class="hero" aria-labelledby="hero-title">
        <div class="hero-frame">
          <div class="grain" aria-hidden="true"></div>

          <header class="site-header">
            <a class="brand" href="#" aria-label="life by ON Original Nutrition — home">
              <span class="brand-name">life</span><span class="brand-by">BY ON</span>
            </a>
            <p class="collection">ORIGINAL NUTRITION · STUDY 01</p>
            <nav class="language-switcher" aria-label="Language selection">
              <button class="language active" type="button" data-lang="zh" aria-pressed="true">繁中</button>
              <span aria-hidden="true">/</span>
              <button class="language" type="button" data-lang="en" aria-pressed="false">EN</button>
            </nav>
          </header>

          <div class="hero-layout">
            <article class="story">
              <p class="eyebrow" data-copy="eyebrow">從自然，到理解</p>
              <h1 id="hero-title" data-copy="title">一顆充滿使命的種子</h1>
              <span class="rule" aria-hidden="true"></span>
              <p class="introduction" data-copy="intro">從一顆完整的黑小茴香種子開始，逐層觀察、開啟與理解，探索大自然蘊藏其中的營養價值。</p>
            </article>

            <div class="deconstruction" aria-label="Nigella sativa seed deconstruction sequence">
              <div class="sequence-line" aria-hidden="true"></div>
              <figure class="stage stage-seed" style="--stage: 0">
                <div class="asset-slot" role="img" data-copy-aria="assetSeed" aria-label="Reserved for verified macro photograph of a whole Nigella sativa seed">
                  <span>IMAGE ASSET 01</span><small>VERIFIED WHOLE SEED</small>
                </div>
                <figcaption><span>SEED</span><span data-copy="seed">種子</span></figcaption>
              </figure>
              <figure class="stage stage-layer" style="--stage: 1">
                <div class="asset-slot" role="img" data-copy-aria="assetLayer" aria-label="Reserved for verified outer layer photographic asset">
                  <span>IMAGE ASSET 02</span><small>VERIFIED OUTER LAYER</small>
                </div>
                <figcaption><span>OUTER LAYER</span><span data-copy="layer">外層</span></figcaption>
              </figure>
              <figure class="stage stage-inner" style="--stage: 2">
                <div class="asset-slot" role="img" data-copy-aria="assetInner" aria-label="Reserved for verified inner structure photographic asset">
                  <span>IMAGE ASSET 03</span><small>VERIFIED INNER STRUCTURE</small>
                </div>
                <figcaption><span>INNER STRUCTURE</span><span data-copy="inner">內層</span></figcaption>
              </figure>
              <figure class="stage stage-core" style="--stage: 3">
                <div class="asset-slot" role="img" data-copy-aria="assetCore" aria-label="Reserved for verified nutritional core photographic asset">
                  <span>IMAGE ASSET 04</span><small>VERIFIED NUTRITIONAL CORE</small>
                </div>
                <figcaption><span>NUTRITIONAL CORE</span><span data-copy="core">營養核心</span></figcaption>
              </figure>
              <figure class="stage stage-compounds" style="--stage: 4">
                <div class="asset-slot conceptual" role="img" data-copy-aria="assetCompounds" aria-label="Reserved for scientifically reviewed natural compounds visual">
                  <span>VISUAL ASSET 05</span><small>SCIENTIFIC REVIEW REQUIRED</small>
                </div>
                <figcaption><span>NATURAL COMPOUNDS</span><span data-copy="compounds">天然活性成分</span></figcaption>
              </figure>
              <figure class="stage stage-thymoquinone" style="--stage: 5">
                <div class="asset-slot conceptual" role="img" data-copy-aria="assetThymoquinone" aria-label="Reserved for scientifically reviewed conceptual thymoquinone visual">
                  <span>CONCEPTUAL STAGE 06</span><small>NOT A PHYSICAL LOCATION</small>
                </div>
                <figcaption><span>THYMOQUINONE</span><span data-copy="thymoquinone">概念成分階段</span></figcaption>
              </figure>
            </div>
          </div>

          <footer class="hero-footer">
            <a class="scroll-cue" href="#sequence-end"><span data-copy="discover">捲動以逐層理解</span><i aria-hidden="true"></i></a>
            <p class="botanical"><em>Nigella sativa</em><span data-copy="botanical">黑小茴香 · 植物研究</span></p>
            <p class="progress"><span id="progress-count">01</span> / 06</p>
          </footer>
        </div>
        <div id="sequence-end" class="sequence-end" aria-hidden="true"></div>
      </section>
    </main>
    <script src="script.js"></script>
  </body>
</html>
