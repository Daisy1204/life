<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="ON Original Nutrition — A Seed with Purpose. Scientific nutrition, considered from the source."
    />
    <title>life — ON Original Nutrition</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600&amp;family=Noto+Sans+TC:wght@300;400;500&amp;family=Newsreader:opsz,wght@6..72,300;6..72,400&amp;display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main>
      <section class="hero" aria-labelledby="hero-title">
        <div class="grain" aria-hidden="true"></div>

        <header class="site-header">
          <a class="brand" href="#" aria-label="life by ON Original Nutrition — home">
            <span class="brand-name">life</span>
            <span class="brand-by">by ON</span>
          </a>

          <nav class="language-switcher" aria-label="Language selection">
            <button class="language active" type="button" data-lang="zh" aria-pressed="true">繁中</button>
            <span aria-hidden="true">/</span>
            <button class="language" type="button" data-lang="en" aria-pressed="false">EN</button>
          </nav>
        </header>

        <div class="hero-content">
          <div class="edition-mark" aria-hidden="true">
            <span>ORIGINAL NUTRITION</span>
            <span>VOL. 01</span>
          </div>

          <div class="copy-block">
            <p class="eyebrow" data-copy="eyebrow">從源頭，重新理解營養</p>
            <h1 id="hero-title" data-copy="title">一顆充滿使命的種子</h1>
            <p class="introduction" data-copy="intro">
              一切始於一顆微小種子。以科學為方法，探索黑小茴香蘊藏的原生力量，讓每日營養回到純粹本質。
            </p>
          </div>

          <figure class="seed-visual" aria-labelledby="seed-caption">
            <div class="orbital orbital-one" aria-hidden="true"></div>
            <div class="orbital orbital-two" aria-hidden="true"></div>
            <div class="image-placeholder">
              <span class="placeholder-index">FIG. 01</span>
              <span class="placeholder-label" data-copy="placeholder">黑小茴香種子<br />高解析真實影像預留位置</span>
              <span class="placeholder-spec">NIGELLA SATIVA · MACRO / 4K</span>
            </div>
            <figcaption id="seed-caption">
              <span data-copy="caption">黑小茴香種子</span>
              <span>Nigella sativa</span>
            </figcaption>
          </figure>
        </div>

        <footer class="hero-footer">
          <div class="research-note">
            <span class="note-number">01</span>
            <p data-copy="note">源自植物的智慧<br />經由現代科學驗證</p>
          </div>
          <a class="scroll-cue" href="#discover" aria-label="Scroll to discover more">
            <span data-copy="discover">向下探索</span>
            <svg viewBox="0 0 16 28" aria-hidden="true">
              <path d="M8 1v24M2 19l6 6 6-6" />
            </svg>
          </a>
          <p class="coordinates">22.3193° N<br />114.1694° E</p>
        </footer>
      </section>

      <div id="discover" class="scroll-space" aria-hidden="true"></div>
    </main>

    <script src="script.js"></script>
  </body>
</html>
